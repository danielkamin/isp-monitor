services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: isp-monitor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password
    volumes:
      - ./deployments/postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d isp-monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  probe-service:
    build:
      context: .
      dockerfile: ./deployments/docker/probe-service.Dockerfile
    env_file: ./services/probe-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - NET_RAW
    ports:
      - "50051:50051"

  analytics-service:
    build:
      context: .
      dockerfile: ./deployments/docker/analytics-service.Dockerfile
    env_file: ./services/analytics-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50052:50052"

  api-service:
    build:
      context: .
      dockerfile: ./deployments/docker/api-service.Dockerfile
    env_file: ./services/api-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50053:50053"

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./deployments/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - loki
volumes:
  postgres_data:
